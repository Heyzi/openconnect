apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
data:
  {{ .Values.configMap.key }}: |
{{ toYaml .Values.baseConfig | indent 4 }}
    model_list: []
{{- if .Values.baseConfigMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.baseConfigMap.name }}
data:
  {{ .Values.baseConfigMap.key }}: |
{{ toYaml .Values.baseConfig | indent 4 }}
{{- end }}
