# The adapter intentionally has a single writer and does not use leader election.
replicaCount: 1

image:
  repository: registry.example.com/litellm-config-adapter
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

configMap:
  name: litellm-generated-config
  key: config.yaml

baseConfigMap:
  create: true
  name: litellm-base-config
  key: config.yaml

# All manually managed LiteLLM settings belong here. model_list is forbidden.
baseConfig:
  litellm_settings:
    cache: true
    success_callback:
      - prometheus

litellm:
  deploymentName: litellm

discovery:
  clusterWide: false

healthChecks:
  timeout: 5s
  successThreshold: 2
  unhealthyGracePeriod: 2m

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
